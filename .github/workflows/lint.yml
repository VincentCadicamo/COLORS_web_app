# Continuous Integration: lint the front-end source on every push and pull request.
# Node.js is used only to install and run the linters, never to serve the app
# (the app itself runs on the LAMP stack).
name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint HTML, CSS, and JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install linting tools
        id: install
        run: npm install --no-audit --no-fund

      # Each linter runs as its own step so a failure in one doesn't hide the others.
      - name: Lint HTML (HTMLHint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:html

      - name: Lint CSS (Stylelint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:css

      - name: Lint JavaScript (ESLint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:js
