name: Deploy COLORS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Key parses OK"
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync site to /var/www/html
        run: |
          rsync -rvz --delete --no-perms --chmod=D755,F644 \
            public/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/html/"

      - name: Ensure database schema
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "MYSQL_PWD='${{ secrets.DB_PASS }}' mysql -u TheBeast COP4331" < db/schema.sql